[project]
name = "fly-transcriber"
version = "0.5.0"
description = "Local, private meeting recorder for macOS: speaker-labelled transcripts saved into your projects for your AI agent."
readme = "README.md"
authors = [
    { name = "Tuomas Härkönen", email = "252577503+tuomasharkonen-ux@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["meeting", "transcription", "diarization", "whisper", "macos", "menubar"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "imageio-ffmpeg>=0.6",
    "pyobjc-framework-cocoa>=12.2,<13",
    "pyobjc-framework-webkit>=12.2,<13",
    "tomli-w>=1.2.0",
]

[project.urls]
Repository = "https://github.com/tuomasharkonen-ux/FLY-transcriber"

[project.scripts]
fly-transcriber = "fly_transcriber.app:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
