name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest  # Apple Silicon, like the app
    env:
      UV_PYTHON: "3.12"  # what install.sh installs the app with
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: sh -n install.sh
